name: Core checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.11'
          - os: windows-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s tests -v
      - run: python -B tools/check_release.py
